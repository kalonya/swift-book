name: Build and Deploy Swift-DocC Site

on:
  push:
    branches: [ "translation-tr" ]

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Swift-DocC into a subdirectory
        run: |
          xcrun docc convert TSPL.docc \
          --output-path .public \
          --transform-for-static-hosting \
          --hosting-base-path swift-book \
          --fallback-display-name "Swift Programlama Dili"
          touch .public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .public
          cname: docs.swift.org.tr
          destination_dir: swift-book